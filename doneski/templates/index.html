<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doneski</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/icon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    // Apply saved theme before first paint to avoid flash of wrong theme.
    (function () {
      var t = localStorage.getItem("doneski-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div id="sidebar-menu-container">
          <button id="btn-sidebar-menu" class="sidebar-menu-toggle" title="More options">☰</button>
          <div id="sidebar-menu" class="sidebar-menu-dropdown" style="display: none;">
            <button id="btn-weekly-report" class="sidebar-menu-item">Weekly Report</button>
            <button id="btn-delete-day" class="sidebar-menu-item danger">Delete Day</button>
            <button id="btn-theme-toggle" class="sidebar-menu-item">Dark Mode</button>
          </div>
        </div>
        <span id="app-name">Doneski</span>
      </div>

      <div id="calendar-container"></div>

      <div id="day-info">
        <div id="day-date"></div>
        <div id="day-relative"></div>
      </div>

      <div id="notes-list-container">
        <button id="btn-new-day" class="sidebar-btn" style="display: none;">New Day</button>
        <ul id="notes-list"></ul>
        <button id="btn-add-note" class="add-note-btn" style="display: none;">+ Add Note</button>
      </div>

    </aside>

    <main id="editor-pane">
      <div id="note-header" style="display: none;">
        <div id="note-title-container">
          <span id="note-title" title=""></span>
          <input id="note-title-input" type="text" maxlength="80" style="display: none;">
        </div>
        <div id="note-controls">
          <button id="btn-save" class="icon-btn" title="Save" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M17 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
            </svg>
          </button>
          <button id="btn-lock" class="icon-btn" title="Lock/Unlock">
            <svg id="icon-locked" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display: none;">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <svg id="icon-unlocked" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/>
            </svg>
          </button>
          <button id="btn-delete" class="icon-btn" title="Delete note">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="editor-banners" style="display: none;">
        <ul>
          <li id="banner-past-day" style="display: none;">You are editing a previous day's notes.</li>
          <li id="banner-network-error" style="display: none;">Unable to reach the server. Changes will not be saved.</li>
        </ul>
      </div>
      <div id="editor-body"></div>
    </main>
  </div>

  <!-- Generic Dialog Modal -->
  <div id="generic-dialog-overlay" style="display: none;">
    <div id="generic-dialog" role="dialog" aria-modal="true" aria-labelledby="generic-dialog-title">
      <div class="dlg-header">
        <span id="generic-dialog-title" class="dlg-title"></span>
        <button id="generic-dialog-close" class="icon-btn dlg-close-btn" title="Close">&times;</button>
      </div>
      <div id="generic-dialog-content" class="dlg-body"></div>
      <div id="generic-dialog-error" class="dlg-error" style="display: none;"></div>
      <div class="dlg-footer">
        <button id="generic-dialog-cancel" class="dlg-btn">Close</button>
        <button id="generic-dialog-action" class="dlg-btn dlg-btn-primary"></button>
      </div>
    </div>
  </div>

  <!-- Weekly Report Modal -->
  <div id="modal-overlay" style="display: none;">
    <div id="modal">
      <div id="modal-header">
        <h2>Weekly Report</h2>
        <button id="modal-close" class="icon-btn" title="Close">&times;</button>
      </div>
      <pre id="modal-body"></pre>
      <div id="modal-footer">
        <button id="btn-copy-report" class="sidebar-btn">Copy to Clipboard</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
